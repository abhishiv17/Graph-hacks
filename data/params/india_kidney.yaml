# India-first parameters for the synthetic kidney pool.
# Sources are in research/synthetic_data.md. Values marked "assumption" are ours.

abo:                      # Agrawal 2014, multicentre Indian donors
  O: 0.371
  B: 0.323
  A: 0.229
  AB: 0.077

pra_bands:                # assumption (Indian PRA positivity 15-23%); Saidman uses 0.70/0.20/0.10
  low:  {share: 0.75, cpra: [0, 20],   positive_xm: 0.05}
  mid:  {share: 0.17, cpra: [21, 80],  positive_xm: 0.45}
  high: {share: 0.08, cpra: [81, 99],  positive_xm: 0.90}

recipient_male_share: 0.80     # AIIMS 2013-22
donor_female_share: 0.79
relations:                      # derived from AIIMS data
  female: {wife: 0.36, mother: 0.50, sister: 0.10, daughter: 0.04}
  male:   {father: 0.54, brother: 0.30, husband: 0.12, son: 0.04}

# HLA antigen frequencies per locus. PLACEHOLDER approximations for India.
# Replace with DKMS-BMST Indian frequencies (Frontiers 2025) before reporting numbers.
hla:
  A:  {A1: 0.14, A2: 0.15, A3: 0.06, A11: 0.17, A24: 0.15, A26: 0.07, A33: 0.14, A68: 0.12}
  B:  {B7: 0.08, B8: 0.07, B15: 0.10, B35: 0.15, B40: 0.13, B44: 0.07, B51: 0.11, B52: 0.10, B57: 0.08, B58: 0.11}
  DR: {DR1: 0.06, DR3: 0.11, DR4: 0.07, DR7: 0.16, DR10: 0.06, DR11: 0.08, DR13: 0.10, DR14: 0.06, DR15: 0.30}
  DQ: {DQ2: 0.25, DQ5: 0.22, DQ6: 0.25, DQ7: 0.18, DQ8: 0.10}

dq_untyped_share: 0.30      # assumption: share of donors with DQ not typed in advance
mfi_threshold: 2000         # antibodies at or above this count as unacceptable (Biro 2019)

failure:                    # Ashlagi 2018 and UNOS refusal data
  xm_positive_low_cpra: 0.10     # cPRA <= 90
  xm_positive_high_cpra: 0.38    # cPRA > 90
  untyped_dq_extra: 0.08         # assumption: extra failure risk per untyped DQ
  offer_refusal: 0.15
  withdrawal: 0.03

arrivals_per_week: 3.5      # kidney, India; sweep 1-10
departure_daily_hazard: 0.00238   # 1/420

timing:                     # Ashlagi et al. 2018 "delay" regime, used for multi-centre pools
  offer_days: 2             # offer stage before both teams accept
  crossmatch_days: 7        # physical crossmatch after acceptance
  match_run_every_days: 7   # weekly match runs (UNOS moved from monthly to weekly)

# Program configuration: how KindRed presents and checks kidney exchanges. These are workflow settings for a
# software demo (swapnet/organs/kidney.py reads them), not clinical guidance.
program:
  label: Kidney
  title: Kidney paired donation
  exchange_label: Kidney exchange
  story:                         # the scripted demo loop and the family whose view the demo opens
    pairs: [P-0154, P-0211, P-0388]
    family_pair: P-0154
  committee_review:              # Authorisation Committee checklist, evaluated per loop (swapnet/programs.py)
    - {key: identity, label: "Identity and relationship papers", kind: documents, documents: [id_proof, relationship_proof]}
    - {key: hla, label: "HLA typing report", kind: documents, documents: [hla_report]}
    - {key: blood_group, label: "Blood group cards", kind: documents, documents: [blood_group_card]}
    - {key: compatibility, label: "Compatibility evidence on every link", kind: compatibility}
    - {key: tests, label: "Lab crossmatch negative on every link", kind: link_tests}
    - {key: consent, label: "Consent", kind: documents, documents: [consent]}
  timeline:                      # proposed planning steps, days after the match (timing above; Delhi HC 42 days)
    - {key: offers, label: "Offers accepted by every hospital", days: 2}
    - {key: tests, label: "Lab crossmatch on every link", days: 9}
    - {key: committee, label: "Authorisation Committee approval", days: 42}
    - {key: surgery, label: "Surgery coordination: every operation in the loop at once", days: 49}
    - {key: recovery, label: "Recovery and follow-up milestones", days: 77}
  scenario:
    id: KPD-SCN-1
    title: "Positive crossmatch, local repair"
    initial_state: "3-way kidney loop Hyderabad → Bengaluru → Kolkata; every hospital has accepted its offer."
    failure_event: "The lab crossmatch on Bengaluru → Kolkata is positive: the patient has an antibody against a donor tissue type that was not typed in advance."
    repair_strategy: "Record the failed link, search two steps around the released families, keep the stored 2-way fallback."
    expected_review_step: "A coordinator approves the repair, uses the fallback, or holds."
