services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]
  backend:
    build: ./backend
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Ask KindRed's model: "groq", "ollama" (local, free) or "anthropic" (Claude). Empty picks whichever key is set.
      KINDRED_ASK_PROVIDER: ${KINDRED_ASK_PROVIDER:-}
      KINDRED_OLLAMA_MODEL: ${KINDRED_OLLAMA_MODEL:-llama3.1:8b}
      # Groq (hosted, OpenAI-compatible, fast): set GROQ_API_KEY in .env and KINDRED_ASK_PROVIDER=groq.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      KINDRED_GROQ_MODEL: ${KINDRED_GROQ_MODEL:-openai/gpt-oss-120b}
      KINDRED_GROQ_FALLBACK: ${KINDRED_GROQ_FALLBACK:-openai/gpt-oss-20b}
      # Sarvam (sarvam.ai): spoken, multi-language graph walkthroughs. Optional; without it the walkthrough is text only.
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      # Ollama runs on the host (it can use the host's GPU and memory there); the container reaches it here.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on: [falkordb]
  web:
    build:
      context: ./web
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3001:3001"]
    depends_on: [backend]
