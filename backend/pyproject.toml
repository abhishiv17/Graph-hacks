[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swapnet"
version = "0.1.0"
description = "KindRed: kidney and liver swap coordination on FalkorDB (synthetic data only)"
requires-python = ">=3.10"
dependencies = [
  "falkordb>=1.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "ortools>=9.10",
  "pyyaml>=6",
  "mcp>=1.2,<2",           # 2.x renamed FastMCP (swapnet/mcp/server.py uses the 1.x API)
  "anthropic>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["swapnet*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
